<svg xmlns="http://www.w3.org/2000/svg" width="120" height="20" role="img" aria-label="license: Apache-2.0">
  <title>license: Apache-2.0</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r"><rect width="120" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="48" height="20" fill="#232F3E"/>
    <rect x="48" width="72" height="20" fill="#C42D44"/>
    <rect width="120" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-rendering="geometricPrecision" transform="scale(.1)">
    <text x="240" y="150" fill="#010101" fill-opacity=".3">license</text>
    <text x="240" y="140">license</text>
    <text x="840.0" y="150" fill="#010101" fill-opacity=".3">Apache-2.0</text>
    <text x="840.0" y="140">Apache-2.0</text>
  </g>
</svg>
